name: Publish release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.8.1
      asset_ref:
        description: Temporary branch containing the signed asset
        required: true
        default: release-upload-v0.8.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out signed asset
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_ref }}

      - name: Assemble signed APK
        run: |
          if [ ! -f dist/FocusPen-Pro-X-0.8.1.apk ]; then
            mkdir -p dist
            cat release-chunks/FocusPen-Pro-X-0.8.1.apk.part-* > dist/FocusPen-Pro-X-0.8.1.apk
          fi

      - name: Upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "dist/FocusPen-Pro-X-0.8.1.apk#FocusPen-Pro-X-0.8.1.apk"
          --repo "$GITHUB_REPOSITORY"
          --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft=false
          --latest
